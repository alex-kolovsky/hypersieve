[package]
name = "hypersieve"
license.workspace = true
repository.workspace = true
version.workspace = true
edition.workspace = true

[workspace]
members = ["hypersieve-abi", "hypersieve-codegen"]

[workspace.package]
license = "MIT OR Apache-2.0"
repository = "https://github.com/alex-kolovsky/hypersieve"
version = "0.1.0"
edition = "2024"

[profile.dev]
panic = "abort"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
spin = "0.9.9"
wasmi = { version = "2.0.0", default-features = false }
buddy_system_allocator = "0.9.1"
hypersieve-codegen = { path = "hypersieve-codegen" }
hypersieve-abi = { path = "hypersieve-abi" }
